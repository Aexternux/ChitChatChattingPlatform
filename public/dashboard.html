<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="icon" href="/favicon.png" type="image/x-icon" />

  <!-- Font Awesome CDN for icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-papbR6Y63PqH7zAGpS0eDlR4xzQc9fWjRcwJ7zPfp0RV67Q4QX8N6tBk1lLxiVRxliwtEl1HsYNezXyI6x2Mzw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  
  <link rel="stylesheet" href="dash.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#007aff" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <style>
    .friend-button {
      margin: 8px 0;
      padding: 8px 12px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #f0f0f0;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .friend-button:hover {
      background-color: #e0e0ff;
    }
    .notif {
      background-color: #ff3b30;
      color: white;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 12px;
      display: none;
      min-width: 18px;
      text-align: center;
    }
    /* Buttons in friend requests and pending */
    #friend-requests div, #pending-requests div {
      margin: 8px 0;
      padding: 8px 12px;
      background: #fafafa;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #friend-requests button, #pending-requests button {
      border: none;
      background: #007bff;
      color: white;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
    }
    #friend-requests button:hover, #pending-requests button:hover {
      background-color: #0056b3;
    }
    #pending-requests button {
      background-color: #dc3545;
    }
    #pending-requests button:hover {
      background-color: #a71d2a;
    }
  </style>
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="container dash">
    <header class="home-head">
      <div>
        <h1 class="home-title">Messages</h1>
        <p class="home-greet">Welcome back, <strong id="username-display"></strong> 👋</p>
      </div>
      <button class="home-add-btn" onclick="goToAddFriends()">
        <i class="fa-solid fa-user-plus"></i> Add Friends
      </button>
    </header>

    <div class="home-grid">
      <section class="panel home-chats">
        <div class="panel-head">
          <h3>Chats</h3>
          <button class="new-group-btn" onclick="openGroupModal()"><i class="fa-solid fa-user-group"></i> New Group</button>
        </div>
        <div class="chats-search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="friend-search" placeholder="Search chats…" autocomplete="off" />
        </div>
        <div id="group-list" class="friend-list"></div>
        <div id="friend-list" class="friend-list"></div>
        <div id="friend-empty-search" class="friend-empty-search" style="display:none">No chats match that search.</div>
      </section>

      <aside class="home-side">
        <section class="panel">
          <div class="panel-head"><h3>Friend Requests</h3></div>
          <div id="friend-requests"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h3>Pending</h3></div>
          <div id="pending-requests"></div>
        </section>
      </aside>
    </div>
  </div>

  <!-- Create-group modal -->
  <div id="group-modal" class="cc-modal hidden">
    <div class="cc-modal-card">
      <div class="cc-modal-head">
        <h3>New Group</h3>
        <button class="cc-modal-x" onclick="closeGroupModal()">✕</button>
      </div>
      <input type="text" id="group-name" maxlength="40" placeholder="Group name (e.g. Study Squad)" />
      <div class="cc-modal-label">Add friends</div>
      <input type="text" id="group-friend-search" class="group-friend-search" placeholder="Search friends…" autocomplete="off" oninput="filterGroupFriends()" />
      <div id="group-friends" class="group-friends"></div>
      <div class="cc-modal-actions">
        <button class="cc-btn-ghost" onclick="closeGroupModal()">Cancel</button>
        <button class="cc-btn-primary" onclick="createGroup()">Create group</button>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-messaging.js"></script>
  <script src="firebase-config.js"></script>
  <script src="profile-utils.js"></script>
  <script src="push.js"></script>

  <script>
    const currentUser = localStorage.getItem("username");
    if (!currentUser) {
      alert("No user logged in. Redirecting to login...");
      window.location.href = "index.html";
    }

    document.getElementById("username-display").textContent = currentUser;

    // ---- Notifications / PWA ----
    let swRegistration = null;
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js")
        .then(reg => { swRegistration = reg; })
        .catch(() => {});
    }
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
    const lastNotifiedTs = {};
    const watchedFriends = new Set();

    function showSystemNotification(title, body, tag) {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const options = {
        body,
        icon: "/favicon.png",
        badge: "/favicon.png",
        tag: tag || "chitchat-msg",
        renotify: true,
        vibrate: [180, 80, 180],
        data: { url: "/dashboard.html" }
      };
      if (swRegistration && swRegistration.showNotification) {
        swRegistration.showNotification(title, options);
      } else {
        try {
          const n = new Notification(title, options);
          n.onclick = () => { window.focus(); n.close(); };
        } catch (e) { /* mobile requires the service worker path */ }
      }
    }

    const friendList = document.getElementById("friend-list");
    const friendRequestsDiv = document.getElementById("friend-requests");
    const pendingRequestsDiv = document.getElementById("pending-requests");

    function loadFriends() {
      friendList.innerHTML = "";

      db.collection("friends")
        .where("user", "==", currentUser)
        .where("accepted", "==", true)
        .onSnapshot(snapshot => {
          friendList.innerHTML = "";

          if (snapshot.empty) {
            friendList.innerHTML = "<p>You have no friends yet. Add some! 🌟</p>";
            return;
          }

          snapshot.forEach(doc => {
            const friendUsername = doc.data().friend;

            db.collection("users").doc(friendUsername).get().then(friendDoc => {
              const friendName = friendDoc.exists ? (friendDoc.data().name || friendUsername) : friendUsername;

              const btn = document.createElement("button");
              btn.className = "friend-button";

              const left = document.createElement("span");
              left.className = "fb-left";
              left.appendChild(makeAvatar(friendUsername, friendName, 46));

              const meta = document.createElement("span");
              meta.className = "fb-meta";
              const nameSpan = document.createElement("span");
              nameSpan.className = "fb-name";
              nameSpan.textContent = friendName;
              const subSpan = document.createElement("span");
              subSpan.className = "fb-sub";
              subSpan.textContent = "@" + friendUsername;
              meta.appendChild(nameSpan);
              meta.appendChild(subSpan);
              left.appendChild(meta);

              const right = document.createElement("span");
              right.className = "fb-right";
              const notif = document.createElement("span");
              notif.className = "notif";
              notif.id = `notif-${friendUsername}`;
              notif.textContent = "0";
              const chev = document.createElement("span");
              chev.className = "fb-chevron";
              chev.innerHTML = "&rsaquo;";
              right.appendChild(notif);
              right.appendChild(chev);

              btn.appendChild(left);
              btn.appendChild(right);
              btn.setAttribute("data-search", (friendName + " @" + friendUsername).toLowerCase());
              btn.onclick = () => openChatWith(friendUsername);

              friendList.appendChild(btn);
              applyFriendFilter();

              watchUnreadMessages(friendUsername);
            });
          });
        });
    }

    // Client-side filter for the Chats search box.
    const friendSearch = document.getElementById("friend-search");
    function applyFriendFilter() {
      const q = (friendSearch.value || "").toLowerCase().trim();
      const rows = document.querySelectorAll(".home-chats .friend-button");
      let shown = 0;
      rows.forEach(b => {
        const match = (b.getAttribute("data-search") || "").includes(q);
        b.style.display = match ? "" : "none";
        if (match) shown++;
      });
      const emptyEl = document.getElementById("friend-empty-search");
      if (emptyEl) emptyEl.style.display = (q && shown === 0 && rows.length) ? "block" : "none";
    }
    friendSearch.addEventListener("input", applyFriendFilter);

    function loadFriendRequests() {
      friendRequestsDiv.innerHTML = "";
      db.collection("friends")
        .where("friend", "==", currentUser)
        .where("accepted", "==", false)
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            friendRequestsDiv.innerHTML = "<p>No friend requests. You're popular! 🎉</p>";
            return;
          }

          snapshot.forEach(doc => {
            const requesterUsername = doc.data().user;

            const div = document.createElement("div");
            div.textContent = requesterUsername;

            const acceptBtn = document.createElement("button");
            acceptBtn.innerHTML = '<i class="fa-solid fa-check"></i> Accept';
            acceptBtn.onclick = () => acceptFriendRequest(doc.id, requesterUsername);

            div.appendChild(acceptBtn);
            friendRequestsDiv.appendChild(div);
          });
        })
        .catch(err => {
          console.error("Error loading friend requests:", err);
          friendRequestsDiv.innerHTML = "<p>Error loading friend requests.</p>";
        });
    }

    function loadPendingFriendRequests() {
      pendingRequestsDiv.innerHTML = "";

      db.collection("friends")
        .where("user", "==", currentUser)
        .where("accepted", "==", false)
        .get()
        .then(snapshot => {
          if (snapshot.empty) {
            pendingRequestsDiv.innerHTML = "<p>No pending friend requests sent. 😊</p>";
            return;
          }

          snapshot.forEach(doc => {
            const pendingFriend = doc.data().friend;

            const div = document.createElement("div");
            div.textContent = pendingFriend;

            const cancelBtn = document.createElement("button");
            cancelBtn.innerHTML = '<i class="fa-solid fa-xmark"></i> Cancel';
            cancelBtn.onclick = () => cancelFriendRequest(doc.id);

            div.appendChild(cancelBtn);
            pendingRequestsDiv.appendChild(div);
          });
        })
        .catch(err => {
          console.error("Error loading pending friend requests:", err);
          pendingRequestsDiv.innerHTML = "<p>Error loading pending requests.</p>";
        });
    }

    function acceptFriendRequest(requestDocId, requesterUsername) {
      db.collection("friends")
        .doc(requestDocId)
        .update({ accepted: true })
        .then(() => {
          return db.collection("friends").add({
            user: currentUser,
            friend: requesterUsername,
            accepted: true
          });
        })
        .then(() => {
          alert("Friend request accepted! 🎉");
          loadFriendRequests();
          loadFriends();
        })
        .catch(err => {
          console.error("Error accepting friend request:", err);
          alert("Failed to accept friend request.");
        });
    }

    function cancelFriendRequest(requestDocId) {
      if (!confirm("Cancel this friend request?")) return;

      db.collection("friends")
        .doc(requestDocId)
        .delete()
        .then(() => {
          alert("Friend request cancelled.");
          loadPendingFriendRequests();
        })
        .catch(err => {
          console.error("Error cancelling friend request:", err);
          alert("Failed to cancel friend request.");
        });
    }

    function openChatWith(friendUsername) {
      const chatId = [currentUser, friendUsername].sort().join('_');

      db.collection("lastRead")
        .doc(chatId + "_" + currentUser)
        .set({ lastRead: Date.now() });

      // Clear any group selection so chat.html opens the 1:1 chat.
      localStorage.removeItem("chatId");
      localStorage.removeItem("chatIsGroup");
      localStorage.removeItem("chatName");
      localStorage.setItem("chatWith", friendUsername);
      window.location.href = "chat.html";
    }

    /* =====================================================================
       GROUP CHATS
    ===================================================================== */
    function openGroupChat(groupId, name) {
      db.collection("lastRead").doc(groupId + "_" + currentUser).set({ lastRead: Date.now() }).catch(() => {});
      localStorage.setItem("chatId", groupId);
      localStorage.setItem("chatName", name || "Group");
      localStorage.setItem("chatIsGroup", "1");
      localStorage.removeItem("chatWith");
      window.location.href = "chat.html";
    }

    function loadGroups() {
      const groupListEl = document.getElementById("group-list");
      db.collection("chats")
        .where("participants", "array-contains", currentUser)
        .onSnapshot(snapshot => {
          const groups = [];
          snapshot.forEach(doc => {
            const d = doc.data();
            if (d && d.isGroup) groups.push({ id: doc.id, name: d.name || "Group", members: (d.participants || []).length, createdAt: d.createdAt || 0 });
          });
          groups.sort((a, b) => b.createdAt - a.createdAt);

          groupListEl.innerHTML = "";
          groups.forEach(g => {
            const btn = document.createElement("button");
            btn.className = "friend-button";
            btn.setAttribute("data-search", (g.name || "group").toLowerCase());

            const left = document.createElement("span");
            left.className = "fb-left";
            const ava = document.createElement("span");
            ava.className = "cc-avatar group-ava";
            ava.textContent = "👥";
            const meta = document.createElement("span");
            meta.className = "fb-meta";
            meta.innerHTML = `<span class="fb-name">${g.name.replace(/[<>&]/g, "")}</span><span class="fb-sub">${g.members} members</span>`;
            left.appendChild(ava);
            left.appendChild(meta);

            const right = document.createElement("span");
            right.className = "fb-right";
            right.innerHTML = '<span class="fb-chevron">&rsaquo;</span>';

            btn.appendChild(left);
            btn.appendChild(right);
            btn.onclick = () => openGroupChat(g.id, g.name);
            groupListEl.appendChild(btn);
          });
          applyFriendFilter();
        }, err => console.error("loadGroups:", err));
    }

    function openGroupModal() {
      const picks = document.getElementById("group-friends");
      picks.innerHTML = "<p class='gf-empty'>Loading friends…</p>";
      document.getElementById("group-name").value = "";
      document.getElementById("group-friend-search").value = "";
      document.getElementById("group-modal").classList.remove("hidden");

      db.collection("friends")
        .where("user", "==", currentUser)
        .where("accepted", "==", true)
        .get()
        .then(snap => {
          picks.innerHTML = "";
          if (snap.empty) { picks.innerHTML = "<p class='gf-empty'>Add some friends first to start a group.</p>"; return; }
          snap.forEach(doc => {
            const fu = doc.data().friend;
            const row = document.createElement("label");
            row.className = "gf-row";
            row.setAttribute("data-name", fu.toLowerCase());
            row.innerHTML = `<input type="checkbox" value="${fu.replace(/"/g, "")}" /><span>${fu.replace(/[<>&]/g, "")}</span>`;
            picks.appendChild(row);
          });
        })
        .catch(() => { picks.innerHTML = "<p class='gf-empty'>Couldn't load friends.</p>"; });
    }
    function closeGroupModal() { document.getElementById("group-modal").classList.add("hidden"); }

    function filterGroupFriends() {
      const q = (document.getElementById("group-friend-search").value || "").toLowerCase().trim();
      const rows = document.querySelectorAll("#group-friends .gf-row");
      let shown = 0;
      rows.forEach(r => {
        const match = (r.getAttribute("data-name") || "").includes(q);
        r.style.display = match ? "" : "none";
        if (match) shown++;
      });
      let note = document.getElementById("gf-no-match");
      if (!note) {
        note = document.createElement("p");
        note.id = "gf-no-match"; note.className = "gf-empty";
        note.textContent = "No friends match that search.";
        document.getElementById("group-friends").appendChild(note);
      }
      note.style.display = (q && shown === 0 && rows.length) ? "block" : "none";
    }

    function createGroup() {
      const name = document.getElementById("group-name").value.trim();
      const checked = Array.from(document.querySelectorAll("#group-friends input:checked")).map(c => c.value);
      if (!name) { alert("Give your group a name."); return; }
      if (checked.length < 2) { alert("Pick at least 2 friends to make a group."); return; }

      const participants = [currentUser, ...checked];
      const groupId = "group_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      db.collection("chats").doc(groupId).set({
        participants: participants,
        name: name,
        isGroup: true,
        createdBy: currentUser,
        createdAt: Date.now()
      }).then(() => {
        closeGroupModal();
        openGroupChat(groupId, name);
      }).catch(e => alert("Could not create group. " + (e.message || "")));
    }

    function watchUnreadMessages(friendUsername) {
      // Avoid attaching duplicate listeners when the friend list re-renders.
      if (watchedFriends.has(friendUsername)) return;
      watchedFriends.add(friendUsername);
      // Baseline: only messages arriving after this point trigger a notification.
      lastNotifiedTs[friendUsername] = Date.now();

      const chatId = [currentUser, friendUsername].sort().join('_');

      db.collection("lastRead")
        .doc(chatId + "_" + currentUser)
        .onSnapshot(lastReadDoc => {
          const lastRead = lastReadDoc.exists ? lastReadDoc.data().lastRead : 0;

          db.collection("chats")
            .doc(chatId)
            .collection("messages")
            .orderBy("timestamp", "desc")
            .limit(1)
            .onSnapshot(snapshot => {
              snapshot.forEach(doc => {
                const data = doc.data();
                const notifEl = document.getElementById(`notif-${friendUsername}`);

                const isUnread = data.sender !== currentUser && data.timestamp > lastRead;

                if (notifEl) {
                  notifEl.style.display = isUnread ? "inline-block" : "none";
                  notifEl.textContent = "1";
                }

                // Push a system notification for genuinely new incoming messages
                // (works while the app is backgrounded, e.g. on your phone).
                if (isUnread && data.timestamp > (lastNotifiedTs[friendUsername] || 0) && document.hidden) {
                  lastNotifiedTs[friendUsername] = data.timestamp;
                  const body = data.text && data.text.startsWith("data:image/")
                    ? "📷 Sent a photo"
                    : (data.text || "");
                  showSystemNotification(`${friendUsername} on ChitChat`, body, "chitchat-" + friendUsername);
                }
              });
            });
        });
    }

    function goToAddFriends() {
      window.location.href = "add-friends.html";
    }

    function goToSettings() {
      window.location.href = "settings.html";
    }

    function goToMyProfile() {
      window.location.href = "profile.html?user=" + encodeURIComponent(currentUser);
    }

    function logout() {
      localStorage.removeItem("username");
      localStorage.removeItem("chatWith");
      window.location.href = "index.html";
    }

    // Load all sections on page load
    loadFriendRequests();
    loadPendingFriendRequests();
    loadFriends();
    loadGroups();
  </script>
  <script src="sidebar.js"></script>
</body>
</html>
